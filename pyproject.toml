[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-cleaner"
version = "0.3.0"
description = "Review AI chat exports and prepare approved local Claude Code/Codex prompt cleanup."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ai-chat-cleaner = "ai_chat_cleaner.cli:main"

[tool.setuptools.packages.find]
include = ["ai_chat_cleaner*"]
